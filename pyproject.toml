[project]
name = "agent-escalation-lab"
version = "0.1.0"
description = "A local lab: attack an over-privileged AI helpdesk agent in a mock Entra ID tenant, then harden it and prove the difference with tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "httpx", "pyyaml"]

[project.optional-dependencies]
anthropic = ["anthropic"]
cedar = ["cedarpy"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # starlette prefers httpx2 for TestClient; httpx still works and is the declared dependency.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401", "B008"]  # Any for JSON; Depends() in defaults is FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
